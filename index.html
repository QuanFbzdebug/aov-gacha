    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AoV Gacha Simulator - CS:GO Style</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #121a22;
            --bg-panel: #1a222b;
            --color-milspec: #4b69ff; /* Xanh lam */
            --color-restricted: #8847ff; /* Tím */
            --color-classified: #d32ce6; /* Hồng */
            --color-covert: #eb4b4b; /* Đỏ */
            --color-rare: #ffd700; /* Vàng */
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: #ffffff;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .gacha-window {
            position: relative;
            width: 100%;
            max-width: 1000px;
            height: 280px;
            background-color: #1a2129;
            margin: 40px auto;
            overflow: hidden;
            border: 1px solid #2a3542;
            border-radius: 4px;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
        }

        /* Center line (Indicator) */
        .gacha-window::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 2px;
            background-color: #eab308; /* Yellow-500 */
            z-index: 50;
            transform: translateX(-50%);
            box-shadow: 0 0 10px #eab308;
        }

        /* Shadow gradients for edges */
        .gacha-window::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(26,33,41,1) 0%, rgba(26,33,41,0) 15%, rgba(26,33,41,0) 85%, rgba(26,33,41,1) 100%);
            z-index: 40;
            pointer-events: none;
        }

        .roulette-track {
            display: flex;
            height: 100%;
            width: max-content;
            align-items: center;
            /* Animation is handled via JS inline styles for dynamic offset */
            will-change: transform;
        }

        .hero-card {
            position: relative;
            width: 160px;
            height: 220px;
            background-color: #242f39;
            margin: 0 6px;
            flex-shrink: 0;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border-bottom: 6px solid;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            transition: transform 0.2s, filter 0.2s;
        }

        .hero-image-container {
            width: 100%;
            height: 100%;
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        .hero-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
        }

        /* Fallback background if image fails */
        .hero-fallback {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 800;
            text-align: center;
            padding: 10px;
            background: radial-gradient(circle at center, #374151 0%, #111827 100%);
            color: rgba(255,255,255,0.7);
            z-index: 0;
        }

        .hero-name-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 15px 5px 5px 5px;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0) 100%);
            z-index: 10;
            text-align: center;
            font-weight: 600;
            font-size: 0.9rem;
            text-shadow: 1px 1px 3px #000;
        }

        /* Dim unselected cards at the end */
        .dimmed .hero-card:not(.winner) {
            filter: brightness(0.3) grayscale(0.5);
            transform: scale(0.95);
        }

        .hero-card.winner {
            transform: scale(1.05);
            z-index: 20;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        /* 12px font for minor text as requested */
        .minor-text {
            font-size: 12px;
            color: #94a3b8; /* slate-400 */
        }
    </style>
</head>

        <div class="flex items-center gap-4 border border-gray-700 bg-[#121a22] px-4 py-1.5 rounded minor-text">

            <span class="text-gray-400">QUÂN HUY</span>

    <main class="flex-grow flex flex-col items-center py-10 px-4">

            <p class="minor-text uppercase tracking-widest">Mở hòm để nhận ngẫu nhiên trang phục hoặc tướng</p>
        </div>

        <!-- The Roulette Container -->
        <div id="gacha-container" class="gacha-window">
            <div id="roulette-track" class="roulette-track">
                <!-- Cards will be injected here via JS -->
            </div>
        </div>

        <div class="flex flex-col items-center gap-6 mt-4">
            <button id="btn-open" class="bg-green-600 hover:bg-green-500 text-white font-bold py-3 px-16 rounded uppercase tracking-wider transition-colors shadow-[0_4px_15px_rgba(22,163,74,0.3)] disabled:opacity-50 disabled:cursor-not-allowed">
                Mở Hòm (100 Quân Huy)
            </button>
            
            <!-- Result Display -->
            <div id="result-display" class="h-16 flex items-center justify-center transition-opacity opacity-0">
                <div class="bg-[#1a222b] border border-gray-700 px-8 py-3 rounded text-center">
                    <p class="minor-text mb-1 uppercase">Bạn nhận được</p>
                    <p id="result-name" class="font-bold text-lg text-yellow-400 drop-shadow-md">...</p>
                </div>
            </div>
        </div>
    </main>

        const RARITIES = [
            { id: 'milspec', color: '#4b69ff', weight: 60, name: 'Bậc A' },
            { id: 'restricted', color: '#8847ff', weight: 25, name: 'Bậc S' },
            { id: 'classified', color: '#d32ce6', weight: 10, name: 'Bậc S+' },
            { id: 'covert', color: '#eb4b4b', weight: 4.5, name: 'Tuyệt Sắc' },
            { id: 'rare', color: '#ffd700', weight: 0.5, name: 'SSS Hữu Hạn' }
        ];

        // Constants for animation
        const CARD_WIDTH = 160;
        const CARD_MARGIN = 12; // 6px left + 6px right
        const ITEM_TOTAL_WIDTH = CARD_WIDTH + CARD_MARGIN;
        const TOTAL_CARDS = 60; // Total cards in the track
        const WIN_INDEX = 50; // The index where the slider stops
        const SPIN_DURATION_MS = 8000; // 8 seconds

        let isSpinning = false;
        let balance = 10000;

        // Elements
        const track = document.getElementById('roulette-track');
        const btnOpen = document.getElementById('btn-open');
        const balanceEl = document.getElementById('balance');
        const resultDisplay = document.getElementById('result-display');
        const resultName = document.getElementById('result-name');
        const container = document.getElementById('gacha-container');

        function getRandomRarity() {
            const rand = Math.random() * 100;
            let cumulative = 0;
            for (const rarity of RARITIES) {
                cumulative += rarity.weight;
                if (rand <= cumulative) {
                    return rarity;
                }
            }
            return RARITIES[0];
        }

        function getRandomHero() {
            const heroIndex = Math.floor(Math.random() * heroesData.length);
            return heroesData[heroIndex];
        }

        // Image fallback handler function directly globally available
        window.handleImageError = function(imgElement, heroName) {
            imgElement.style.display = 'none'; // Hide broken image
            // The fallback background (hero-fallback) is naturally underneath.
        };

        function createCard(hero, rarity) {
            const div = document.createElement('div');
            div.className = 'hero-card';
            div.style.borderColor = rarity.color;
            
            // Generate HTML with image and fallback background
            div.innerHTML = `
                <div class="hero-fallback">${hero.name}</div>
                <div class="hero-image-container">
                    <img class="hero-image" src="${hero.imgUrl}" alt="${hero.name}" onerror="window.handleImageError(this, '${hero.name.replace(/'/g, "\\'")}')">
                </div>
                <div class="hero-name-overlay">${hero.name}</div>
                <div class="absolute top-0 left-0 w-full px-2 py-1 flex justify-between items-center z-10 bg-gradient-to-b from-black/80 to-transparent">
                    <span class="minor-text font-bold" style="color: ${rarity.color}">${rarity.name}</span>
                </div>
            `;
            return div;
        }

        function spinGacha() {
            if (isSpinning) return;
            
            if (balance < 100) {
                alert("Không đủ Quân Huy!");
                return;
            }

            // Deduct balance
            balance -= 100;
            balanceEl.innerText = balance;
            
            isSpinning = true;
            btnOpen.disabled = true;
            resultDisplay.classList.remove('opacity-100');
            resultDisplay.classList.add('opacity-0');
            track.classList.remove('dimmed');
            
            // Clear existing track
            track.innerHTML = '';
            track.style.transition = 'none';
            track.style.transform = 'translateX(0)';

            // Generate sequence
            let winnerHero = null;
            let winnerRarity = null;
            let winnerCardNode = null;

            for (let i = 0; i < TOTAL_CARDS; i++) {
                const hero = getRandomHero();
                const rarity = getRandomRarity();
                const card = createCard(hero, rarity);
                
                if (i === WIN_INDEX) {
                    winnerHero = hero;
                    winnerRarity = rarity;
                    winnerCardNode = card;
                }
                
                track.appendChild(card);
            }

            // Force reflow
            void track.offsetWidth;

            const containerWidth = container.offsetWidth;
            
            // Jitter to make it look realistic (stop randomly within the card boundaries)
            // min jitter: -(CARD_WIDTH/2 - 10), max jitter: +(CARD_WIDTH/2 - 10)
            const maxJitter = (CARD_WIDTH / 2) - 10;
            const jitter = (Math.random() * maxJitter * 2) - maxJitter;
            
            // Offset calculation:
            // Distance to winner card starting edge = (WIN_INDEX * ITEM_TOTAL_WIDTH)
            // Center of card = + (ITEM_TOTAL_WIDTH / 2)
            // Minus half of container to put it in center = - (containerWidth / 2)
            // Plus random jitter = + jitter
            const finalOffset = (WIN_INDEX * ITEM_TOTAL_WIDTH) + (ITEM_TOTAL_WIDTH / 2) - (containerWidth / 2) + jitter;

            // Apply transition and transform
            track.style.transition = `transform ${SPIN_DURATION_MS}ms cubic-bezier(0.1, 0, 0, 1)`;
            track.style.transform = `translateX(-${finalOffset}px)`;

            // Handle spin end
            setTimeout(() => {
                isSpinning = false;
                btnOpen.disabled = false;
                
                // Dim others and highlight winner
                track.classList.add('dimmed');
                winnerCardNode.classList.add('winner');

                // Show result UI
                resultName.innerText = `${winnerHero.name} - ${winnerRarity.name}`;
                resultName.style.color = winnerRarity.color;
                resultDisplay.classList.remove('opacity-0');
                resultDisplay.classList.add('opacity-100');
                
            }, SPIN_DURATION_MS);
        }

        // Initialize display
        function initInitialDisplay() {
            for (let i = 0; i < 15; i++) {
                const hero = getRandomHero();
                const rarity = getRandomRarity();
                track.appendChild(createCard(hero, rarity));
            }
        }

        // Event Listeners
        btnOpen.addEventListener('click', spinGacha);
        window.addEventListener('DOMContentLoaded', initInitialDisplay);

    </script>
